name: Feature request
description: A tool, an argument or a result field an agent needs
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is the agent trying to find out or do that scout-mcp makes hard or impossible? Describe the situation, not the feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like scout-mcp to do
      description: If it widens what an agent can make scout do — reach more hosts, carry a credential, invoke a tool that is not read-only — say why that is safe.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I have checked this is not already possible with the existing tools and flags
