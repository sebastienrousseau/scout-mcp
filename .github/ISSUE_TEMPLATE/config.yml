blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/sebastienrousseau/scout-mcp/security/advisories/new
    about: Report privately. Do not open a public issue for a security problem.
  - name: Question or idea
    url: https://github.com/sebastienrousseau/scout-mcp/discussions
    about: For anything that is not a bug report or a concrete feature request.
