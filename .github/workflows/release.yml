# A release is the binaries, the container image the registry listing
# points at, their checksums and signatures, and SLSA provenance. The
# registry listing itself is published by hand afterwards; see
# docs/publishing.md.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry-run mode: builds every artefact and the image, then stops short of
  # publishing, signing and attesting, so release machinery can be proven
  # before a tag depends on it.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package without publishing"
        type: boolean
        default: true

permissions: {}

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # true for a manual dry run, false for a tag push.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      CGO_ENABLED: '0'
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Guards a real publish: the ref must be a semver tag pointing at this
      # commit on main, every file that names the version must name this
      # one, and the version must be scout's latest release.
      #
      # Skipped on a dry run, which has no tag at all.
      - name: Verify release ref
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
          bash scripts/verify-release-versions.sh "${GITHUB_REF_NAME}"

      - name: Version Lockstep
        if: env.DRY_RUN != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/lockstep.sh

      - name: Test release source
        env:
          GOTOOLCHAIN: auto
        run: go test -count=1 ./...

      # QEMU handles the arm64 image on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cosign, for `signs:` and `docker_signs:`. Keyless signing uses the
      # same OIDC token the provenance attestation does, so there is no
      # long-lived signing key to leak.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          # A dry run builds everything, the image included, and publishes,
          # signs and announces nothing.
          args: ${{ env.DRY_RUN == 'true' && 'release --clean --snapshot --skip=publish,sign,announce' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dry-run artefacts for inspection
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dry-run-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

      # SLSA build provenance for every artefact goreleaser emitted, in one
      # shot through the checksums file. Verify with
      # `gh attestation verify <file> --owner sebastienrousseau`.
      - name: Attest release artifacts
        id: attest
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # Attach the provenance bundle to the release itself, so whoever has
      # the archive can verify it without knowing the attestation API exists.
      - name: Publish provenance alongside the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          if [ -z "${BUNDLE}" ] || [ ! -f "${BUNDLE}" ]; then
            echo "::error::attestation step produced no bundle at '${BUNDLE}'"
            exit 1
          fi
          cp "${BUNDLE}" "${RUNNER_TEMP}/checksums.txt.intoto.jsonl"
          gh release upload "${GITHUB_REF_NAME}" \
            "${RUNNER_TEMP}/checksums.txt.intoto.jsonl" --clobber
